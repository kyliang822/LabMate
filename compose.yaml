services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labmate}
      POSTGRES_DB: ${POSTGRES_DB:-labmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment: &backend_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-labmate}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-labmate}
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_DIR: /uploads
    command: [python, -m, scripts.migrate]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    environment: *backend_env
    volumes: [uploads:/uploads]
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health/ready")']
      interval: 10s
      timeout: 3s
      retries: 5
  publisher:
    build: .
    environment: *backend_env
    command: [python, -m, backend.app.async_tasks.publisher]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-labmate}:${POSTGRES_PASSWORD}@postgres/labmate_test
      UPLOAD_DIR: /tmp/test-uploads
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  uploads:
